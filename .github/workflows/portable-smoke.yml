name: Portable release verification
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to verify
        required: true
        default: v0.1.0
permissions:
  contents: read
jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download published portable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'StrokeScape-*-Windows-x64.zip' --dir release
      - name: Verify EXE generation and MP4 export
        shell: pwsh
        run: |
          $archive = Get-ChildItem release/StrokeScape-*-Windows-x64.zip | Select-Object -First 1
          python scripts/verify_portable.py $archive.FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-verification
          path: |
            build/portable-verification/*/verification.json
            build/portable-verification/*/painting.mp4
            build/portable-verification/*/test-data/StrokeScape.log
